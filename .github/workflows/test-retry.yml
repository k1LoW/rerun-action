name: Test Retry

on:
  workflow_run:
    workflows: ["Test Target"]
    types:
      - completed

jobs:
  retry-with-pattern-and-job:
    runs-on: ubuntu-slim
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rerun with pattern + job
        uses: ./
        with:
          run_id: ${{ github.event.workflow_run.id }}
          pattern: 'Network partition'
          job: 'flaky-job'
          max_attempts: 3
